name: Build Momentum packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  desktop:
    name: Build ${{ matrix.name }}
    strategy:
      matrix:
        include:
          - name: Windows EXE
            os: windows-latest
            command: '--win nsis'
          - name: Linux packages
            os: ubuntu-latest
            command: '--linux AppImage deb'
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build web bundle
        run: pnpm run build:web
        env:
          BASE_PATH: ./
          PORT: 4173
      - name: Build desktop package
        run: pnpm exec electron-builder --config electron-builder.yml ${{ matrix.command }}
      - name: Upload desktop packages
        uses: actions/upload-artifact@v4
        with:
          name: momentum-${{ matrix.name }}
          path: release/*

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build web bundle
        run: pnpm run build:web
        env:
          BASE_PATH: ./
          PORT: 4173
      - name: Add Android project
        run: pnpm run android:add
      - name: Sync Capacitor
        run: pnpm exec cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: momentum-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - desktop
      - android
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/**/* 